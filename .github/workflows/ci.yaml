name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job: the whole suite is pure node and runs in well under a second, so
  # splitting it would cost more in runner startup than it could ever save.
  # The browser job this replaced existed for stories, which this repo no
  # longer contains.
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No `version` input: the action reads `packageManager` from package.json,
      # which is the single place the pnpm version is written.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The package ships compiled JS, so a build that breaks is a release that
      # breaks. Proving it builds on every PR is the cheapest place to find out.
      - name: Build
        run: pnpm build
