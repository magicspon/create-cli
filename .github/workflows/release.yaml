name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    # The release commit is generated, not written, so the local hooks have
    # nothing to check. Leaving husky installed means every bot commit has to
    # satisfy commitlint and re-run typecheck through nano-staged, which is a
    # way for a release to fail that has nothing to do with the release.
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      # No `version` input: the action reads `packageManager` from package.json,
      # which is the single place the pnpm version is written.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: changesets/action@v1
        with:
          publish: pnpm release
          # Conventional, because `Version Packages` is not a commit message
          # this repo accepts and the release branch merges back into main.
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
