packages:
  - '.'

minimumReleaseAge: 4320

# No `allowBuilds`: nothing in the tree declares an install or postinstall
# script any more — vitest 5 dropped esbuild for rolldown and no longer pulls
# msw, and lightningcss ships prebuilt binaries rather than compiling one. A
# dependency that adds a build script fails `--frozen-lockfile` and names
# itself, which is the point: rule on it here when that happens.
